name: Java CI - QuickChat Tests

# Runs the JUnit tests automatically on every push and pull request,
# so the code is tested with every change (CI requirement in the brief).
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with Maven
        run: mvn -B test
